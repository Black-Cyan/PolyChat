name: Build PolyChat

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        jdk: [21]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # 安装完整 JDK
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - name: Verify Java
        run: java -version

      # Make gradlew executable on Unix systems
      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      # 构建 ShadowJar
      - name: Build ShadowJar
        uses: gradle/gradle-build-action@v3
        with:
          arguments: clean shadowJar

      # 获取版本号
      - name: Get project version
        run: echo "VERSION=$(./gradlew -q printVersion)" >> $GITHUB_ENV

      # jlink 生成 runtime (Unix)
      - name: Create custom runtime (Unix)
        if: runner.os != 'Windows'
        run: |
          jlink \
            --module-path $JAVA_HOME/jmods \
            --add-modules java.base,java.desktop,java.sql \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2 \
            --output runtime

      # jlink 生成 runtime (Windows)
      - name: Create custom runtime (Windows)
        if: runner.os == 'Windows'
        run: |
          jlink --module-path $env:JAVA_HOME/jmods --add-modules java.base,java.desktop,java.sql --strip-debug --no-header-files --no-man-pages --compress=2 --output runtime

      # jpackage 打可执行程序 (Unix)
      - name: Package app (Unix)
        if: runner.os != 'Windows'
        run: |
          jpackage \
            --name PolyChat \
            --input build/libs \
            --main-jar PolyChat-${{ env.VERSION }}-all.jar \
            --runtime-image runtime \
            --type app-image \
            --dest dist

      # jpackage 打可执行程序 (Windows)
      - name: Package app (Windows)
        if: runner.os == 'Windows'
        run: |
          jpackage --name PolyChat --input build/libs --main-jar PolyChat-$env:VERSION-all.jar --runtime-image runtime --type app-image --dest dist

      # 上传可执行文件
      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: polychat-${{ matrix.os }}-${{ env.VERSION }}
          path: dist/
