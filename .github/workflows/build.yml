name: Build PolyChat

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        jdk: [21]
    runs-on: ${{ matrix.os }}
    env:
      NATIVE_IMAGE_FLAGS: --no-fallback -O2 -J-Xmx4g
      SHADOW_PATTERN: PolyChat-*-all.jar
      NATIVE_NAME: PolyChat
      NATIVE_OUTPUT: dist

    steps:
      - uses: actions/checkout@v3

      # 安装 GraalVM 并启用 native-image
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1.2.0
        with:
          distribution: graalvm-community
          java-version: ${{ matrix.jdk }}
          native-image: true

      - name: Verify Java
        run: java -version

      # 赋予 gradlew 执行权限
      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x gradlew

      # 构建 ShadowJar
      - name: Build ShadowJar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat clean shadowJar

      - name: Build ShadowJar (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./gradlew clean shadowJar

      # 获取版本号
      - name: Get project version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = .\gradlew.bat -q printVersion
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Get project version (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "VERSION=$(./gradlew -q printVersion)" >> $GITHUB_ENV

      - name: Locate ShadowJar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $jar = Get-ChildItem build\libs\$env:SHADOW_PATTERN | Sort-Object FullName | Select-Object -First 1
          if (-not $jar) { Write-Error "Shadow JAR not found"; exit 1 }
          echo "SHADOW_JAR=$($jar.FullName)" >> $env:GITHUB_ENV

      - name: Locate ShadowJar (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          JAR_FILE=$(find build/libs -name "$SHADOW_PATTERN" | sort | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Shadow JAR not found" >&2
            exit 1
          fi
          echo "SHADOW_JAR=$JAR_FILE" >> "$GITHUB_ENV"

      - name: Set artifact OS label (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "ARTIFACT_OS=windows" >> $env:GITHUB_ENV

      - name: Set artifact OS label (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "ARTIFACT_OS=linux" >> "$GITHUB_ENV"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "ARTIFACT_OS=macos" >> "$GITHUB_ENV"
          else
            echo "ARTIFACT_OS=unknown" >> "$GITHUB_ENV"
          fi

      # 使用 GraalVM native-image 生成可执行文件
      - name: Build native executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:NATIVE_OUTPUT | Out-Null
          $flags = $env:NATIVE_IMAGE_FLAGS -split ' '
          native-image @flags -jar $env:SHADOW_JAR -H:Name=$env:NATIVE_NAME -H:Path=$env:NATIVE_OUTPUT

      - name: Build native executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$NATIVE_OUTPUT"
          native-image $NATIVE_IMAGE_FLAGS -jar "$SHADOW_JAR" -H:Name="$NATIVE_NAME" -H:Path="$NATIVE_OUTPUT"

      # 上传可执行文件
      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: polychat-${{ env.ARTIFACT_OS }}-native-${{ env.VERSION }}
          path: ${{ env.NATIVE_OUTPUT }}/
