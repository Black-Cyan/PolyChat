name: Build PolyChat

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        jdk: [21]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      # 安装 GraalVM JDK 21
      - name: Setup GraalVM
        uses: actions/setup-java@v3
        with:
          distribution: graalvm-ce
          java-version: ${{ matrix.jdk }}
          java-package: jdk

      - name: Verify Java
        run: java -version

      # 安装 Native Image
      - name: Install Native Image
        run: gu install native-image

      # 赋予 gradlew 执行权限
      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x gradlew

      # 构建 ShadowJar
      - name: Build ShadowJar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat clean shadowJar

      - name: Build ShadowJar (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./gradlew clean shadowJar

      # 获取版本号
      - name: Get project version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = .\gradlew.bat -q printVersion
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Get project version (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "VERSION=$(./gradlew -q printVersion)" >> $GITHUB_ENV

      # 构建 Native Executable
      - name: Build Native Executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $jar = Get-ChildItem build\libs\PolyChat-*-all.jar | Select-Object -First 1
          native-image -jar $jar.FullName --no-fallback --no-server -H:Name=PolyChat

      - name: Build Native Executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          JAR_FILE=$(ls build/libs/PolyChat-*-all.jar)
          native-image -jar "$JAR_FILE" --no-fallback --no-server -H:Name=PolyChat

      # 上传可执行文件
      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: polychat-${{ runner.os == 'Linux' && 'linux' || (runner.os == 'macOS' && 'macos') || 'windows' }}-${{ env.VERSION }}
          path: PolyChat*
