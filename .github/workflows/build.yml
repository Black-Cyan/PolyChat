name: Build PolyChat Native

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      # 安装 GraalVM
      - name: Install GraalVM (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install java 23.0.2-graalce
          sdk use java 23.0.2-graalce
          export PATH="$JAVA_HOME/bin:$PATH"
          gu install native-image

      - name: Install GraalVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install graalvm --version=22.3.3 -y
          $env:GRAALVM_HOME = "C:\Program Files\GraalVM\graalvm-ce-java21-22.3.3"
          $env:PATH = "$env:GRAALVM_HOME\bin;$env:PATH"
          gu install native-image

      # 验证 Java 和 native-image
      - name: Verify GraalVM
        run: |
          java -version
          native-image --version

      # 赋予 gradlew 执行权限
      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x gradlew

      # 构建 ShadowJar
      - name: Build ShadowJar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat clean shadowJar

      - name: Build ShadowJar (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./gradlew clean shadowJar

      # 获取版本号
      - name: Get project version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = .\gradlew.bat -q printVersion
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Get project version (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "VERSION=$(./gradlew -q printVersion)" >> $GITHUB_ENV

      # 构建 Native Executable
      - name: Build Native Executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $jar = Get-ChildItem build\libs\PolyChat-*-all.jar | Select-Object -First 1
          native-image --no-fallback --no-server --name PolyChat $jar.FullName

      - name: Build Native Executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          JAR_FILE=$(ls build/libs/PolyChat-*-all.jar)
          native-image --no-fallback --no-server --name PolyChat "$JAR_FILE"

      # 上传可执行文件
      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: polychat-${{ runner.os == 'Linux' && 'linux' || runner.os == 'macOS' && 'macos' || 'windows'}}-${{ env.VERSION }}
          path: PolyChat*
